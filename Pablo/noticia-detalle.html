<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Unidad de Cuidados Intensivos - Clínica Capurri S.A</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'teal': '#00B4C5',
                        'teal-dark': '#009AAB',
                        'navy': '#2C5F7C',
                        'green-card': '#7FBF3F',
                        'yellow-card': '#F5B842',
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans">
    <!-- Header Navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <nav class="flex items-center justify-between py-4">
                <div class="flex items-center">
                    <a href="index.html"><img src="recursos/logoHeader.png" alt="Clínica Capurri S.A" class="h-12"></a>                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-green-600 hover:text-green-700 transition">Inicio</a>
                    <a href="quienes-somos.html" class="text-green-600 hover:text-green-700 transition">Quiénes somos</a>
                    <a href="servicios.html" class="text-green-600 hover:text-green-700 transition">Servicios</a>
                    <a href="noticias.html" class="text-green-600 hover:text-green-700 transition">Noticias</a>
                    <a href="contactanos.html" class="text-green-600 hover:text-green-700 transition">Contáctanos</a>
                </div>
                <div class="md:hidden">
                    <button class="text-white">
                        <i class="fas fa-bars text-2xl"></i>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- Breadcrumb -->
    <section class="py-4 bg-gray-50">
        <div class="container mx-auto px-4">
            <nav class="text-sm" id="breadcrumb">
                <a href="index.html" class="text-gray-600 hover:text-teal">Inicio</a>
                <span class="mx-2 text-gray-400">/</span>
                <a href="noticias.html" class="text-gray-600 hover:text-teal">Noticias</a>
                <span class="mx-2 text-gray-400">/</span>
                <span class="text-teal">Cargando...</span>
            </nav>
        </div>
    </section>

    <!-- Article Content -->
    <article class="py-16 bg-white">
        <div class="container mx-auto px-4">
            <div class="max-w-4xl mx-auto" id="article-content">
                <!-- Loading state -->
                <div class="text-center py-12">
                    <i class="fas fa-spinner fa-spin text-4xl text-teal"></i>
                    <p class="text-gray-600 mt-4">Cargando noticia...</p>
                </div>
            </div>
        </div>
    </article>

    <!-- Back to News -->
    <section class="py-12 bg-gray-50">
        <div class="container mx-auto px-4">
            <div class="max-w-4xl mx-auto text-center">
                <a href="noticias.html" class="inline-flex items-center text-teal hover:text-teal-dark font-semibold">
                    <i class="fas fa-arrow-left mr-2"></i>Volver a Noticias
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-navy py-8">
        <div class="container mx-auto px-4">
            <div class="flex justify-center space-x-6 mb-4">
                <a href="#" class="text-white hover:text-teal transition">
                    <i class="fab fa-instagram text-2xl"></i>
                </a>
                <a href="#" class="text-white hover:text-teal transition">
                    <i class="fab fa-facebook text-2xl"></i>
                </a>
            </div>
            <div class="text-center">
                <a href="admin-login.html" class="text-white/50 hover:text-white text-xs transition">
                    <i class="fas fa-lock mr-1"></i>Admin
                </a>
            </div>
        </div>
    </footer>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // Load news article on page load
        document.addEventListener('DOMContentLoaded', loadNewsArticle);

        async function loadNewsArticle() {
            // Get news ID from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const newsId = urlParams.get('id');

            if (!newsId) {
                displayError('No se especificó una noticia');
                return;
            }

            try {
                // Fetch the news article
                const { data: news, error } = await supabase
                    .from('news')
                    .select('*')
                    .eq('id', newsId)
                    .single();

                if (error) throw error;

                if (!news) {
                    displayError('Noticia no encontrada');
                    return;
                }

                displayArticle(news);
            } catch (error) {
                console.error('Error loading news:', error);
                displayError('Error al cargar la noticia');
            }
        }

        function displayArticle(news) {
            // Update page title
            document.title = `${news.title} - Clínica Chinita`;

            // Update breadcrumb
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = `
                <a href="index.html" class="text-gray-600 hover:text-teal">Inicio</a>
                <span class="mx-2 text-gray-400">/</span>
                <a href="noticias.html" class="text-gray-600 hover:text-teal">Noticias</a>
                <span class="mx-2 text-gray-400">/</span>
                <span class="text-teal">${news.title}</span>
            `;

            // Format date
            const formattedDate = new Date(news.created_at).toLocaleDateString('es-ES', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            // Display article
            const articleDiv = document.getElementById('article-content');
            articleDiv.innerHTML = `
                <!-- Article Header -->
                <header class="mb-8">
                    <h1 class="text-4xl lg:text-5xl font-bold text-navy mb-4">
                        ${news.title}
                    </h1>
                    <div class="flex items-center space-x-4 text-gray-600">
                        <span><i class="far fa-calendar mr-2"></i>${formattedDate}</span>
                        <span><i class="far fa-clock mr-2"></i>${news.read_time}</span>
                        <span><i class="far fa-user mr-2"></i>${news.author}</span>
                    </div>
                </header>

                <!-- Featured Image -->
                ${news.image_url ? `
                    <div class="mb-8 rounded-3xl overflow-hidden shadow-lg">
                        <img src="${news.image_url}" alt="${news.title}" class="w-full h-96 object-cover">
                    </div>
                ` : `
                    <div class="mb-8 rounded-3xl overflow-hidden shadow-lg">
                        <div class="h-96 bg-gradient-to-br from-teal to-teal-dark flex items-center justify-center">
                            <i class="fas fa-newspaper text-white text-8xl"></i>
                        </div>
                    </div>
                `}

                <!-- Article Body -->
                <div class="prose prose-lg max-w-none text-gray-700">
                    ${news.content}
                </div>
            `;
        }

        function displayError(message) {
            const articleDiv = document.getElementById('article-content');
            articleDiv.innerHTML = `
                <div class="text-center py-12">
                    <i class="fas fa-exclamation-circle text-4xl text-red-500 mb-4"></i>
                    <p class="text-gray-600 text-lg mb-6">${message}</p>
                    <a href="noticias.html" class="inline-flex items-center text-teal hover:text-teal-dark font-semibold">
                        <i class="fas fa-arrow-left mr-2"></i>Volver a Noticias
                    </a>
                </div>
            `;
        }
    </script>
</body>
</html>
