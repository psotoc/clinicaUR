<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Clínica Chinita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'teal': '#00B4C5',
                        'teal-dark': '#009AAB',
                        'navy': '#2C5F7C',
                    }
                }
            }
        }
    </script>
    <style>
        .ql-editor {
            min-height: 300px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Top Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html">
                        <img src="recursos/logoHeader.png" alt="Clínica Chinita" class="h-10 cursor-pointer hover:opacity-80 transition">
                    </a>
                    <span class="ml-4 text-lg font-semibold text-navy">Panel de Administración</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email" class="text-sm text-gray-600"></span>
                    <button onclick="handleLogout()" class="text-sm text-teal hover:text-teal-dark">
                        <i class="fas fa-sign-out-alt mr-1"></i>Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header with Add Button -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-navy">Gestión de Noticias</h1>
            <button onclick="showAddModal()" class="bg-teal hover:bg-teal-dark text-white px-6 py-2 rounded-lg transition">
                <i class="fas fa-plus mr-2"></i>Nueva Noticia
            </button>
        </div>

        <!-- News List -->
        <div id="news-list" class="bg-white rounded-lg shadow">
            <div class="p-8 text-center text-gray-500">
                <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
                <p>Cargando noticias...</p>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="news-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h2 id="modal-title" class="text-2xl font-bold text-navy">Nueva Noticia</h2>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
            </div>

            <form id="news-form" class="p-6 space-y-6">
                <input type="hidden" id="news-id">

                <!-- Title -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Título</label>
                    <input type="text" id="news-title" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal focus:border-transparent">
                </div>

                <!-- Summary -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Resumen</label>
                    <textarea id="news-summary" rows="3" required
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal focus:border-transparent"></textarea>
                </div>

                <!-- Content (Rich Text Editor) -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contenido</label>
                    <div id="editor" class="bg-white border border-gray-300 rounded-lg"></div>
                </div>

                <!-- Image Upload -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Imagen</label>
                    <input type="file" id="news-image" accept="image/*"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal focus:border-transparent">
                    <p class="text-xs text-gray-500 mt-1">Sube una nueva imagen o deja en blanco para mantener la actual</p>
                    <div id="current-image-preview" class="mt-2 hidden">
                        <img id="preview-img" class="h-32 rounded-lg object-cover" alt="Preview">
                    </div>
                </div>

                <!-- Author -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Autor</label>
                    <input type="text" id="news-author" value="Comunicaciones"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal focus:border-transparent">
                </div>

                <!-- Read Time -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tiempo de Lectura</label>
                    <input type="text" id="news-read-time" value="5 min"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal focus:border-transparent">
                </div>

                <!-- Featured -->
                <div class="flex items-center">
                    <input type="checkbox" id="news-featured" class="h-4 w-4 text-teal focus:ring-teal border-gray-300 rounded">
                    <label for="news-featured" class="ml-2 block text-sm text-gray-700">
                        Destacar esta noticia en la portada
                    </label>
                </div>

                <!-- Submit Buttons -->
                <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
                    <button type="button" onclick="closeModal()" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                        Cancelar
                    </button>
                    <button type="submit" class="px-6 py-2 bg-teal hover:bg-teal-dark text-white rounded-lg transition">
                        <i class="fas fa-save mr-2"></i>Guardar Noticia
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="load-env.js"></script>
    <script src="supabase-config.js"></script>
    <script>
        let quill;
        let currentNewsId = null;

        // Initialize Quill Editor
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize Supabase
            await initSupabase();

            quill = new Quill('#editor', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote', 'code-block'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        [{ 'color': [] }, { 'background': [] }],
                        ['link'],
                        ['clean']
                    ]
                }
            });

            checkAuth();
            loadNews();
        });

        // Check Authentication
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();

            if (!session) {
                window.location.href = 'admin-login.html';
                return;
            }

            document.getElementById('user-email').textContent = session.user.email;
        }

        // Logout
        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.href = 'admin-login.html';
        }

        // Load all news
        async function loadNews() {
            try {
                const { data: news, error } = await supabase
                    .from('news')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                displayNews(news);
            } catch (error) {
                console.error('Error loading news:', error);
                document.getElementById('news-list').innerHTML = `
                    <div class="p-8 text-center text-red-600">
                        <i class="fas fa-exclamation-circle text-3xl mb-4"></i>
                        <p>Error al cargar las noticias</p>
                    </div>
                `;
            }
        }

        // Display news list
        function displayNews(news) {
            const listDiv = document.getElementById('news-list');

            if (news.length === 0) {
                listDiv.innerHTML = `
                    <div class="p-8 text-center text-gray-500">
                        <i class="fas fa-newspaper text-3xl mb-4"></i>
                        <p>No hay noticias. ¡Crea tu primera noticia!</p>
                    </div>
                `;
                return;
            }

            listDiv.innerHTML = `
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Título</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Autor</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Destacada</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${news.map(item => `
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm font-medium text-gray-900">${item.title}</div>
                                        <div class="text-sm text-gray-500">${item.summary.substring(0, 60)}...</div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.author}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(item.created_at).toLocaleDateString('es-ES')}</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        ${item.featured ? '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Sí</span>' : '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">No</span>'}
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                        <button onclick="editNews('${item.id}')" class="text-teal hover:text-teal-dark mr-3">
                                            <i class="fas fa-edit"></i> Editar
                                        </button>
                                        <button onclick="deleteNews('${item.id}')" class="text-red-600 hover:text-red-900">
                                            <i class="fas fa-trash"></i> Eliminar
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Show add modal
        function showAddModal() {
            currentNewsId = null;
            document.getElementById('modal-title').textContent = 'Nueva Noticia';
            document.getElementById('news-form').reset();
            document.getElementById('news-id').value = '';
            quill.setContents([]);
            document.getElementById('current-image-preview').classList.add('hidden');
            document.getElementById('news-modal').classList.remove('hidden');
        }

        // Edit news
        async function editNews(id) {
            try {
                const { data: news, error } = await supabase
                    .from('news')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                currentNewsId = id;
                document.getElementById('modal-title').textContent = 'Editar Noticia';
                document.getElementById('news-id').value = news.id;
                document.getElementById('news-title').value = news.title;
                document.getElementById('news-summary').value = news.summary;
                document.getElementById('news-author').value = news.author;
                document.getElementById('news-read-time').value = news.read_time;
                document.getElementById('news-featured').checked = news.featured;
                quill.root.innerHTML = news.content;

                if (news.image_url) {
                    document.getElementById('current-image-preview').classList.remove('hidden');
                    document.getElementById('preview-img').src = news.image_url;
                }

                document.getElementById('news-modal').classList.remove('hidden');
            } catch (error) {
                console.error('Error loading news:', error);
                alert('Error al cargar la noticia');
            }
        }

        // Delete news
        async function deleteNews(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar esta noticia?')) {
                return;
            }

            try {
                const { error } = await supabase
                    .from('news')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                loadNews();
            } catch (error) {
                console.error('Error deleting news:', error);
                alert('Error al eliminar la noticia');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('news-modal').classList.add('hidden');
        }

        // Handle form submission
        document.getElementById('news-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Guardando...';

            try {
                const title = document.getElementById('news-title').value;
                const summary = document.getElementById('news-summary').value;
                const content = quill.root.innerHTML;
                const author = document.getElementById('news-author').value;
                const readTime = document.getElementById('news-read-time').value;
                const featured = document.getElementById('news-featured').checked;
                const imageFile = document.getElementById('news-image').files[0];
                let imageUrl = null;

                // Upload image if provided
                if (imageFile) {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `${Math.random().toString(36).substring(2)}.${fileExt}`;
                    const filePath = `${fileName}`;

                    const { data: uploadData, error: uploadError } = await supabase.storage
                        .from('news-images')
                        .upload(filePath, imageFile);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = supabase.storage
                        .from('news-images')
                        .getPublicUrl(filePath);

                    imageUrl = urlData.publicUrl;
                }

                const newsData = {
                    title,
                    summary,
                    content,
                    author,
                    read_time: readTime,
                    featured,
                    updated_at: new Date().toISOString()
                };

                if (imageUrl) {
                    newsData.image_url = imageUrl;
                }

                if (currentNewsId) {
                    // Update existing news
                    const { error } = await supabase
                        .from('news')
                        .update(newsData)
                        .eq('id', currentNewsId);

                    if (error) throw error;
                } else {
                    // Insert new news
                    const { error } = await supabase
                        .from('news')
                        .insert([newsData]);

                    if (error) throw error;
                }

                closeModal();
                loadNews();
            } catch (error) {
                console.error('Error saving news:', error);
                alert('Error al guardar la noticia: ' + error.message);
            } finally {
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-save mr-2"></i>Guardar Noticia';
            }
        });
    </script>
</body>
</html>
